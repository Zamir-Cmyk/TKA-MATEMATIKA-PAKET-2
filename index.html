<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan TKA Matematika</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14233b;--mut:#5a6b85;--line:#d3dbe7;--ac:#1f5fd6;--acs:#e3ecfc;--ok:#1b7f4b;--oks:#dff3e8;--no:#b8312f;--nos:#fbe4e3;--fl:#f2b300;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--card:#18243a;--ink:#e6edf8;--mut:#9fb0c9;--line:#2c3b57;--ac:#6ea0ff;--acs:#22345a;--ok:#5ad196;--oks:#173a2b;--no:#ff8b88;--nos:#41201f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1826;--card:#18243a;--ink:#e6edf8;--mut:#9fb0c9;--line:#2c3b57;--ac:#6ea0ff;--acs:#22345a;--ok:#5ad196;--oks:#173a2b;--no:#ff8b88;--nos:#41201f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 2px 10px}
h1{font-size:19px;margin:0}
.tm{font-weight:700;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);border-radius:99px;padding:4px 14px;background:var(--card)}
.nums{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px}
.nums button{flex:0 0 auto;width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;position:relative;cursor:pointer}
.nums button.an{background:var(--acs);border-color:var(--ac)}
.nums button.cur{outline:3px solid var(--ac);outline-offset:1px}
.nums button.fl::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--fl)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.qh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;margin-bottom:10px}
.ty{font-weight:400;color:var(--mut);font-size:15px}
.body{margin-bottom:10px}
.qq{font-weight:700;margin:12px 0}
.m{font-family:"Cambria Math","STIX Two Math",Cambria,serif;font-size:19px;margin:8px 0 8px 12px;line-height:1.8}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1.5px solid currentColor}
sup{font-size:.72em;line-height:0}
.sys{display:inline-block;border-left:3px solid var(--ink);padding-left:10px;font-family:"Cambria Math",Cambria,serif;line-height:1.7}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer}
.opt b{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:14px}
.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel b{background:var(--ac);border-color:var(--ac);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--oks)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.no{border-color:var(--no);background:var(--nos)}.opt.no b{background:var(--no);border-color:var(--no);color:var(--card)}
.opt.miss{border:2px dashed var(--ok)}
.opt:disabled{cursor:default}
table{border-collapse:collapse;margin:8px 0;max-width:100%}
td,th{border:1.5px solid var(--ink);padding:4px 12px;text-align:left}
.tf{width:100%;border-color:var(--line)}.tf td,.tf th{border-color:var(--line)}
.tf td.c{text-align:center;width:84px;padding:4px}
.tf .opt{justify-content:center;margin:0;padding:6px}.tf .opt b{margin:0}
.fig{width:100%;max-width:460px;display:block;margin:8px 0}
.fig .g line{stroke:var(--line);stroke-width:1}.fig .ax{stroke:var(--ink);stroke-width:1.5}
.fig .ln{stroke:var(--ink);stroke-width:2;fill:none}.fig .rg{fill:var(--mut);opacity:.55}
.fig text{fill:var(--ink);font-size:12px}.fig .pt{fill:var(--ac);stroke:var(--ink)}.fig .pl{fill:var(--ac);font-weight:700;font-size:14px}
.ex{border-radius:10px;padding:14px 16px;margin-top:14px;border:1.5px solid}
.ex.g{background:var(--oks);border-color:var(--ok)}.ex.b{background:var(--nos);border-color:var(--no)}
.ex ul{margin:6px 0 0;padding-left:20px}.ex p{margin:6px 0}
.sol{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:space-between}
.btn{font:inherit;font-weight:700;border-radius:99px;border:0;padding:10px 20px;cursor:pointer;background:var(--ac);color:#fff}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.fl{background:var(--fl);color:#1b1b1b}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.nums button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.score{font-size:44px;font-weight:700;margin:4px 0}
.rv{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.rv button{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;border:1.5px solid;cursor:pointer;background:var(--card);color:var(--ink)}
.rv .y{border-color:var(--ok);background:var(--oks)}.rv .n{border-color:var(--no);background:var(--nos)}
</style></head><body><div class="wrap">

</div>
<script>
const fr=(a,b)=>`<span class="fr"><i>${a}</i><i>${b}</i></span>`;
const sys=(...l)=>`<span class="sys">${l.join("<br>")}</span>`;
const L="ABCDE";
const gx=x=>30+(x+6)*40,gy=y=>20+(5-y)*40;
function fig(){let g="";for(let x=-6;x<=4;x++)g+=`<line x1="${gx(x)}" y1="20" x2="${gx(x)}" y2="260"/>`;for(let y=-1;y<=5;y++)g+=`<line x1="30" y1="${gy(y)}" x2="430" y2="${gy(y)}"/>`;
let t="";for(let x=-6;x<=4;x++)if(x)t+=`<text x="${gx(x)}" y="236" text-anchor="middle">${x}</text>`;for(let y=-1;y<=5;y++)if(y)t+=`<text x="${gx(0)-6}" y="${gy(y)+4}" text-anchor="end">${y}</text>`;
return `<svg class="fig" viewBox="0 0 460 280" role="img" aria-label="Grafik dua garis f dan g dengan segitiga arsir bertitik sudut A(-4,0), B(0,2), C(2,0)"><g class="g">${g}</g>
<polygon class="rg" points="${gx(-4)},${gy(0)} ${gx(0)},${gy(2)} ${gx(2)},${gy(0)}"/>
<line class="ax" x1="30" y1="${gy(0)}" x2="430" y2="${gy(0)}"/><line class="ax" x1="${gx(0)}" y1="20" x2="${gx(0)}" y2="260"/>${t}
<line class="ln" x1="${gx(-6)}" y1="${gy(-1)}" x2="${gx(4)}" y2="${gy(4)}"/><line class="ln" x1="${gx(-3)}" y1="${gy(5)}" x2="${gx(3)}" y2="${gy(-1)}"/>
<text x="${gx(-5.6)}" y="${gy(-0.5)}">f</text><text x="${gx(-2.7)}" y="${gy(4.8)}">g</text><text x="${gx(0)+8}" y="30">y</text><text x="420" y="${gy(0)-6}">x</text>
${[["A",-4,0,-14,-8],["B",0,2,6,-8],["C",2,0,6,-8]].map(p=>`<circle class="pt" cx="${gx(p[1])}" cy="${gy(p[2])}" r="5"/><text class="pl" x="${gx(p[1])+p[3]}" y="${gy(p[2])+p[4]}">${p[0]}</text>`).join("")}</svg>`}
const tx=(x,y,s,a,e)=>`<text x="${x}" y="${y}" text-anchor="${a||"middle"}" font-weight="700" ${e||""}>${s}</text>`;
function fig9(){const P=[[-22,-16],[8,-26],[26,-4],[-30,10],[0,6],[20,26]],C={r:"#c62828",l:"#fff",a:"#f06fa0"},bq=[["A","85.000","rllrla"],["B","70.000","llraa"],["C","75.000","arrlr"]];
let s=`<svg class="fig" viewBox="0 0 400 220" role="img" aria-label="Tiga buket bunga: tipe A Rp85.000, tipe B Rp70.000, tipe C Rp75.000">`;
bq.forEach((b,i)=>{const x=70+i*130;s+=`<polygon points="${x-34},82 ${x+34},82 ${x},150" fill="#7fc8a9" stroke="var(--ink)"/>`;[...b[2]].forEach((c,k)=>{s+=`<circle cx="${x+P[k][0]}" cy="${50+P[k][1]}" r="11" fill="${C[c]}" stroke="var(--ink)" stroke-width="1.5"/>`});s+=tx(x,170,"Buket Tipe "+b[0])+tx(x,188,"Rp"+b[1]+",00")});
[["Bunga mawar","r",20],["Bunga lili","l",140],["Bunga anyelir","a",260]].forEach(l=>{s+=`<circle cx="${l[2]}" cy="210" r="8" fill="${C[l[1]]}" stroke="var(--ink)"/>`+tx(l[2]+14,214,l[0],"start",'font-weight="400"')});return s+"</svg>"}
function fig10(){return `<svg class="fig" viewBox="0 0 320 180" role="img" aria-label="Segitiga siku-siku dengan garis tengah sejajar alas, sudut A, B, C, D, E, F"><polyline class="ln" points="30,150 30,10 270,150 30,150"/><line class="ln" x1="8" y1="88" x2="230" y2="88"/><polygon points="100,83 112,88 100,93" fill="var(--ink)"/><polygon points="140,145 152,150 140,155" fill="var(--ink)"/><polyline class="ln" points="30,138 42,138 42,150" style="stroke-width:1"/>${tx(40,34,"A","start")}${tx(143,82,"F")}${tx(176,80,"E")}${tx(145,106,"B")}${tx(180,106,"D")}${tx(236,145,"C")}</svg>`}
function fig11(){const H=[200,20],q=(u,v)=>(200+u*120)+","+(150+u*70-v*130);
return `<svg class="fig" viewBox="0 0 400 320" role="img" aria-label="Kamar berbentuk balok A B C D E F G H dengan rak buku gantung di dinding CDHG"><polygon points="200,150 80,220 80,90 200,20" style="fill:var(--acs)" stroke="var(--ink)"/><polygon points="200,150 320,220 320,90 200,20" style="fill:var(--acs);opacity:.7" stroke="var(--ink)"/><polygon points="200,150 80,220 200,290 320,220" style="fill:var(--line)" stroke="var(--ink)"/><polyline class="ln" points="80,90 200,160 320,90" stroke-dasharray="5 4"/><line class="ln" x1="200" y1="160" x2="200" y2="290" stroke-dasharray="5 4"/><polygon points="${q(.1,.55)} ${q(.5,.55)} ${q(.5,.6)} ${q(.1,.6)}" fill="#8a5a2b" stroke="var(--ink)"/><polygon points="${q(.1,.38)} ${q(.5,.38)} ${q(.5,.43)} ${q(.1,.43)}" fill="#8a5a2b" stroke="var(--ink)"/><line x1="262" y1="92" x2="300" y2="60" stroke="var(--ink)"/>${tx(304,58,"Rak buku gantung","start",'style="font-size:11px"')}${tx(200,12,"H")}${tx(66,92,"E","end")}${tx(334,96,"G","start")}${tx(208,178,"F","start")}${tx(208,142,"D","start")}${tx(66,228,"A","end")}${tx(200,308,"B")}${tx(334,228,"C","start")}</svg>`}
function fig12(){return `<svg class="fig" viewBox="0 0 300 270" role="img" aria-label="Trapesium KLMN dan NMPO: OP 18 cm, KL 32 cm, KN 16 cm"><polygon class="ln" points="30,230 254,230 198,118 30,118"/><polygon class="ln" points="30,118 198,118 156,34 30,34"/><line class="ln" x1="156" y1="34" x2="156" y2="230"/><line class="ln" x1="156" y1="34" x2="254" y2="230"/><polyline class="ln" points="30,218 42,218 42,230" style="stroke-width:1"/>${tx(22,32,"O","end")}${tx(156,26,"P")}${tx(22,122,"N","end")}${tx(206,114,"M","start")}${tx(162,134,"Q","start")}${tx(22,236,"K","end")}${tx(156,248,"R")}${tx(262,236,"L","start")}${tx(93,24,"OP = 18 cm")}${tx(142,262,"KL = 32 cm")}${tx(12,176,"KN = 16 cm","middle",'transform="rotate(-90 12 176)"')}</svg>`}
function fig13(){let p="";for(let i=0;i<7;i++){const t=(i+.5)/7;p+=`<circle cx="${60+144*t}" cy="${30+60*t-8}" r="9" fill="#d2693a" stroke="var(--ink)"/>`}
return `<svg class="fig" viewBox="0 0 340 270" role="img" aria-label="Kebun trapesium siku-siku dengan sisi kiri 500 cm, kanan 350 cm, bawah 360 cm; pot di sisi miring atas"><polygon class="ln" points="60,230 204,230 204,90 60,30" style="fill:var(--acs)"/>${p}${tx(52,135,"500 cm","end")}${tx(212,165,"350 cm","start")}${tx(132,252,"360 cm")}${tx(250,50,"Pot tanaman")}</svg>`}
function grid(px,py,lb,w){const u=18,o=130;let s=`<svg viewBox="0 0 260 260" width="${w||200}" style="max-width:100%" role="img" aria-label="Bidang koordinat dengan titik ${lb} di (${px}, ${py})">`;for(let i=-6;i<=6;i++){s+=`<line x1="${o+i*u}" y1="${o-6*u}" x2="${o+i*u}" y2="${o+6*u}" stroke="var(--line)"/><line x1="${o-6*u}" y1="${o+i*u}" x2="${o+6*u}" y2="${o+i*u}" stroke="var(--line)"/>`;if(i&&i%2==0){s+=`<text x="${o+i*u}" y="${o+13}" text-anchor="middle" font-size="9" fill="var(--ink)">${i}</text><text x="${o-4}" y="${o-i*u+3}" text-anchor="end" font-size="9" fill="var(--ink)">${i}</text>`}}
return s+`<line class="ax" x1="${o-6*u}" y1="${o}" x2="${o+6*u}" y2="${o}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${o}" y1="${o-6*u}" x2="${o}" y2="${o+6*u}" stroke="var(--ink)" stroke-width="1.5"/><circle cx="${o+px*u}" cy="${o-py*u}" r="4.5" fill="var(--ac)"/><text x="${o+px*u+7}" y="${o-py*u-6}" font-size="15" font-weight="700" fill="var(--ac)">${lb}</text></svg>`}
const Q=[
{t:"s",body:`Diberikan tiga himpunan bilangan sebagai berikut:<div class="m">A = {x | x &lt; 6, x ∈ Bilangan Asli}<br>B = {x | x bilangan genap, x ∈ Bilangan Cacah}<br>C = {x | x ≤ 10, x ∈ Bilangan Prima}</div>`,q:`Hasil dari (A ∩ B) ∪ C adalah ....`,
o:["{2, 3, 5, 7}","{0, 2, 3, 5, 7}","{2, 3, 4, 5, 7}","{0, 2, 3, 4, 5, 7}","{2, 3, 4, 5, 7, 10}"],a:2,
w2:['Himpunan ini sama dengan C saja. Soal meminta (A ∩ B) ∪ C, jadi hasil A ∩ B juga harus digabung. A ∩ B = {2, 4}, dan angka 4 tidak ada di C. Karena angka 4 tidak muncul, pilihan ini kurang lengkap.','Pilihan ini memasukkan 0 dan melewatkan 4. Angka 0 bukan anggota A karena bilangan asli dimulai dari 1, jadi 0 tidak mungkin ada di irisan A ∩ B. Angka 4 justru harus ada, karena 4 ada di A dan juga genap (ada di B).','Benar. A = {1, 2, 3, 4, 5} dan B = {0, 2, 4, 6, ...}. Irisan A ∩ B adalah angka yang ada di keduanya: {2, 4}. C = {2, 3, 5, 7}. Gabungkan keduanya tanpa mengulang angka yang sama: {2, 3, 4, 5, 7}.','Hampir benar, tetapi ada angka 0 yang tidak seharusnya masuk. Irisan hanya berisi angka yang ada di A dan B sekaligus. Angka 0 ada di B (bilangan cacah) tetapi tidak ada di A (bilangan asli mulai dari 1), dan 0 juga bukan bilangan prima, jadi 0 tidak boleh ada.','Angka 10 tidak seharusnya ada. 10 bukan bilangan prima karena habis dibagi 2 dan 5 (10 = 2 × 5), jadi bukan anggota C. 10 juga bukan anggota A karena A hanya sampai 5.'],w:["Ini hanya himpunan C. Hasil irisan A ∩ B = {2, 4} belum digabungkan, sehingga angka 4 hilang.","Angka 4 hilang dan 0 ikut masuk. Bilangan asli dimulai dari 1, jadi 0 bukan anggota A dan tidak mungkin ada di irisan.","Benar. A ∩ B = {2, 4}, lalu digabung dengan C = {2, 3, 5, 7} menghasilkan {2, 3, 4, 5, 7}.","Angka 0 tidak boleh masuk karena 0 bukan anggota A (bilangan asli). Walaupun 0 adalah bilangan cacah genap, irisan hanya memuat anggota yang ada di A dan B sekaligus.","Angka 10 bukan bilangan prima (10 = 2 × 5), jadi tidak ada di C. Angka 10 juga tidak ada di A karena A hanya sampai 5."],
s:`A = {1, 2, 3, 4, 5}.<br>B = {0, 2, 4, 6, 8, ...}.<br>A ∩ B = {2, 4}.<br>C = {2, 3, 5, 7}.<br>(A ∩ B) ∪ C = {2, 3, 4, 5, 7}.`},
{t:"s",body:`Bentuk sederhana dari <span class="m">${fr("3<sup>2/3</sup> × 8<sup>3/2</sup>","2<sup>5/2</sup> × 9<sup>5/6</sup>")}</span> adalah ....`,q:"",
o:[fr(1,42),fr(2,3),fr(4,3),"6","12"],a:2,
w2:['Hasil ini tidak muncul dari perhitungan yang benar. Cara aman: ubah semua bilangan menjadi basis 2 dan 3, lalu kurangkan pangkat yang basisnya sama. Pangkat 3: 2/3 − 5/3 = −1. Pangkat 2: 9/2 − 5/2 = 2. Hasilnya 2<sup>2</sup> × 3<sup>−1</sup> = 4/3, bukan 1/42.','Faktor 3<sup>−1</sup> (yaitu 1/3) sudah benar, tetapi pangkat 2 salah. Pembilang memuat 8<sup>3/2</sup> = 2<sup>9/2</sup> dan penyebut memuat 2<sup>5/2</sup>, sehingga pangkat 2 = 9/2 − 5/2 = 2. Hasilnya 2<sup>2</sup> = 4, bukan 2. Hasil akhir 4 × 1/3 = 4/3.','Benar. 8<sup>3/2</sup> = (2<sup>3</sup>)<sup>3/2</sup> = 2<sup>9/2</sup> dan 9<sup>5/6</sup> = (3<sup>2</sup>)<sup>5/6</sup> = 3<sup>5/3</sup>. Basis 2: 2<sup>9/2 − 5/2</sup> = 2<sup>2</sup> = 4. Basis 3: 3<sup>2/3 − 5/3</sup> = 3<sup>−1</sup> = 1/3. Kalikan: 4 × 1/3 = 4/3.','Hasil 6 = 2 × 3 muncul jika pangkat 2 dianggap 1 dan pangkat 3 dianggap +1. Keduanya salah: pangkat 2 = 9/2 − 5/2 = 2 (hasil 4), dan pangkat 3 = 2/3 − 5/3 = −1 (hasil 1/3, bukan 3).','Faktor 4 sudah benar, tetapi faktor 3 salah tanda. 12 = 4 × 3, padahal pangkat 3 adalah −1 sehingga hasilnya 4 × 1/3 = 4/3. Pangkat negatif berarti dibalik menjadi pecahan.'],w:["Hasil ini tidak muncul dari pengurangan pangkat yang benar. Cek lagi: pangkat 3 menjadi 2/3 − 5/3 = −1, dan pangkat 2 menjadi 9/2 − 5/2 = 2.","Pangkat 3 sudah benar (3<sup>−1</sup>), tetapi pangkat 2 salah. Seharusnya 2<sup>2</sup> = 4, bukan 2.","Benar. 2<sup>2</sup> × 3<sup>−1</sup> = 4 × 1/3 = 4/3.","Pangkat 3 salah tanda. Seharusnya 3<sup>−1</sup> (di penyebut), bukan 3<sup>1</sup>.","Pangkat 3 salah tanda. 12 = 4 × 3, padahal faktor 3 seharusnya berada di penyebut."],
s:`Samakan basis jadi 2 dan 3:<br>8<sup>3/2</sup> = (2<sup>3</sup>)<sup>3/2</sup> = 2<sup>9/2</sup><br>9<sup>5/6</sup> = (3<sup>2</sup>)<sup>5/6</sup> = 3<sup>5/3</sup><br>Basis 2: 2<sup>9/2 − 5/2</sup> = 2<sup>2</sup> = 4<br>Basis 3: 3<sup>2/3 − 5/3</sup> = 3<sup>−1</sup> = 1/3<br>Hasil = 4/3.`},
{t:"t",body:`Operasi biner ⊙ didefinisikan sebagai <span class="m">a ⊙ b = ${fr("(a − b)<sup>2</sup> + 2ab","a + b")}</span> untuk setiap bilangan real tidak negatif a dan b.`,q:`Jika a ⊙ 2 = 5, tentukan Benar atau Salah pada setiap pernyataan berikut!`,
o:["a merupakan kelipatan dari 3.","a merupakan bilangan prima.","a ⊙ 0 = 6."],a:[true,false,true],
w2:['Benar. Pertama cari a dari a ⊙ 2 = 5. Rumusnya bisa disederhanakan menjadi (a² + b²)/(a + b), jadi (a² + 4)/(a + 2) = 5. Kalikan silang: a² − 5a − 6 = 0, yaitu (a − 6)(a + 1) = 0. Karena a tidak boleh negatif, a = 6. Angka 6 = 3 × 2, jadi 6 kelipatan 3.','Salah. Bilangan prima hanya punya dua pembagi: 1 dan dirinya sendiri. Angka 6 punya pembagi 1, 2, 3, dan 6, jadi 6 bukan bilangan prima.','Benar. Masukkan a = 6 dan b = 0 ke rumus: (6² + 0²)/(6 + 0) = 36/6 = 6. Jadi a ⊙ 0 = 6 sesuai pernyataan.'],w:["Benar. a = 6 dan 6 = 3 × 2.","Salah. 6 punya faktor 1, 2, 3, dan 6, jadi bukan bilangan prima.","Benar. 6 ⊙ 0 = (6² + 0) / (6 + 0) = 36/6 = 6."],
s:`Sederhanakan: (a − b)² + 2ab = a² + b², jadi a ⊙ b = (a² + b²) / (a + b).<br>a ⊙ 2 = 5 → (a² + 4) / (a + 2) = 5 → a² + 4 = 5a + 10 → a² − 5a − 6 = 0 → (a − 6)(a + 1) = 0.<br>Karena a tidak negatif, a = 6.`},
{t:"s",body:`Seorang peneliti memodelkan peningkatan suhu akibat pemanasan global dengan fungsi linear berikut:<div class="m">y = 0,02x − 39,9</div>dengan x mewakili tahun dan y mewakili peningkatan suhu dalam derajat Celsius.`,q:"Pada tahun berapakah peningkatan suhu diperkirakan mencapai 0,7°C?",
o:["Tahun 2000.","Tahun 2003.","Tahun 2025.","Tahun 2030.","Tahun 2345."],a:3,
w2:['Masukkan x = 2000: y = 0,02 × 2000 − 39,9 = 40 − 39,9 = 0,1°C. Peningkatannya baru 0,1°C, masih jauh dari 0,7°C.','Masukkan x = 2003: 0,02 × 2003 = 40,06, jadi y = 40,06 − 39,9 = 0,16°C. Masih terlalu kecil.','Masukkan x = 2025: 0,02 × 2025 = 40,5, jadi y = 40,5 − 39,9 = 0,6°C. Sudah dekat, tetapi masih kurang 0,1°C dari 0,7°C.','Benar. 0,02 × 2030 = 40,6, jadi y = 40,6 − 39,9 = 0,7°C. Bisa juga dicari langsung: 0,7 = 0,02x − 39,9, lalu 0,02x = 40,6, sehingga x = 40,6 : 0,02 = 2030.','Masukkan x = 2345: 0,02 × 2345 = 46,9, jadi y = 46,9 − 39,9 = 7°C. Itu sepuluh kali lipat dari 0,7°C. Biasanya terjadi karena koma tergeser satu angka.'],w:["Pada x = 2000, y = 40 − 39,9 = 0,1°C. Belum 0,7.","Pada x = 2003, y = 40,06 − 39,9 = 0,16°C. Masih terlalu kecil.","Pada x = 2025, y = 40,5 − 39,9 = 0,6°C. Mendekati, tetapi belum 0,7.","Benar. Pada x = 2030, y = 40,6 − 39,9 = 0,7°C.","Pada x = 2345, y = 46,9 − 39,9 = 7°C. Jauh melebihi 0,7."],
s:`Substitusikan y = 0,7:<br>0,7 = 0,02x − 39,9<br>0,02x = 40,6<br>x = 40,6 / 0,02 = 2030.`},
{t:"s",body:`Tempat Les Pintarku memberikan potongan biaya kursus kepada 50 pendaftar pertama, sedangkan harga normal berlaku untuk pendaftar lainnya. Biaya setelah potongan: <span class="m">y = 0,9x</span> (x biaya mula-mula, y biaya setelah potongan).<br>Siswa berprestasi mendapat tambahan potongan sesuai nilai rapor:<div class="m">g(y) = ${sys("0,7y, jika nilai rapor di atas 90","0,8y, jika nilai rapor 85 − 90")}</div>g(y) adalah biaya akhir setelah tambahan diskon.<br>Fira, pendaftar ke-50, membayar biaya kursus Rp180.000,00. Setelah itu datang empat siswa lain dengan informasi berikut:<table><tr><th>Nama</th><th>Nilai Rapor</th><th>Uang yang dimiliki (Rp)</th></tr><tr><td>Andi</td><td>90</td><td>285.000</td></tr><tr><td>Budi</td><td>92</td><td>286.000</td></tr><tr><td>Cici</td><td>89</td><td>280.000</td></tr><tr><td>Dini</td><td>95</td><td>287.000</td></tr></table>`,q:"Dengan uang yang dimiliki, siapakah siswa yang pasti dapat mengikuti kursus?",
o:["Dini.","Dini dan Budi.","Dini, Budi dan Andi.","Dini, Cici, Budi dan Andi.","Cici dan Andi."],a:1,
w2:['Dini memang pasti mampu, tetapi jawabannya belum lengkap. Budi punya uang Rp286.000, yang juga lebih dari harga normal tertinggi yang mungkin (sekitar Rp285.714), jadi Budi juga pasti mampu.','Benar. Rapor Fira tidak diketahui, jadi harga normal x bisa Rp200.000, Rp250.000, atau sekitar Rp285.714 (lihat langkah penyelesaian). Siswa yang datang setelah Fira membayar harga normal. Agar PASTI mampu, uang harus minimal Rp285.714. Hanya Budi (286.000) dan Dini (287.000) yang memenuhi.','Andi hanya punya Rp285.000, kurang sekitar Rp714 dari harga normal tertinggi yang mungkin (Rp285.714). Jika harga normalnya ternyata setinggi itu, Andi tidak bisa ikut. Jadi Andi belum pasti mampu.','Andi (Rp285.000) dan Cici (Rp280.000) belum pasti mampu: jika harga normal ternyata sekitar Rp285.714, uang mereka kurang. Kata kunci soal adalah pasti, bukan mungkin.','Cici dan Andi adalah dua siswa dengan uang paling sedikit, jadi justru merekalah yang paling berisiko kurang. Yang pasti mampu adalah Budi dan Dini.'],w:["Terlalu sedikit. Budi (uang Rp286.000) juga pasti cukup, karena uangnya melebihi harga normal tertinggi yang mungkin (sekitar Rp285.714).","Benar. Hanya Budi (Rp286.000) dan Dini (Rp287.000) yang uangnya melebihi harga normal tertinggi yang mungkin, yaitu sekitar Rp285.714.","Andi belum pasti bisa. Uangnya Rp285.000, kurang dari Rp285.714 (harga normal tertinggi yang mungkin).","Andi (Rp285.000) dan Cici (Rp280.000) belum pasti bisa, karena harga normal bisa mencapai sekitar Rp285.714.","Uang Cici dan Andi justru yang paling sedikit, sehingga belum pasti cukup. Yang pasti bisa adalah Budi dan Dini."],
s:`Fira pendaftar ke-50, jadi mendapat potongan 10%: y = 0,9x. Nilai rapor Fira tidak diketahui, sehingga biaya akhirnya Rp180.000 bisa berasal dari tiga kemungkinan:<br>Tanpa diskon rapor: 0,9x = 180.000 → x = 200.000.<br>Diskon rapor 0,8: 0,8 × 0,9x = 180.000 → x = 250.000.<br>Diskon rapor 0,7: 0,7 × 0,9x = 180.000 → x ≈ 285.714.<br>Empat siswa datang setelah Fira (pendaftar ke-51 dan seterusnya), sehingga membayar harga normal x. Agar PASTI mampu, uang harus cukup untuk kemungkinan x terbesar, yaitu sekitar Rp285.714.<br>Andi (285.000) dan Cici (280.000) kurang dari itu, sedangkan Budi (286.000) dan Dini (287.000) cukup. Jadi yang pasti bisa ikut: Dini dan Budi.`},
{t:"s",body:`Pada pertandingan sepak bola Indonesia melawan Jepang, kelompok pendukung tim Indonesia akan duduk membentuk koreo dengan beberapa orang memegang kertas berwarna yang dibentangkan. Total kertas berwarna yang dipegang pendukung di barisan kursi paling bawah adalah 400 lembar, kemudian di baris kedua 550 lembar, dan semakin bertambah pada barisan kursi berikutnya dengan pola penambahan yang sama.`,q:"Jika pola penambahan tersebut berlaku sampai pada baris kursi ketujuh, maka berapa banyak penonton yang memegang kertas koreo di baris ke-5?",
o:["700 orang.","850 orang.","1.000 orang.","1.150 orang.","1.300 orang."],a:2,
w2:['700 adalah banyak kertas di baris ke-3 (400 + 2 × 150), bukan baris ke-5. Cek polanya: baris ke-1 = 400 dan baris ke-2 = 550, jadi tiap baris bertambah 150.','850 adalah banyak kertas di baris ke-4 (400 + 3 × 150). Baris ke-5 harus ditambah 150 lagi.','Benar. Polanya 400, 550, 700, 850, 1.000 (tambah 150 tiap baris). Dengan rumus barisan aritmetika: U5 = 400 + (5 − 1) × 150 = 1.000.','1.150 adalah banyak kertas di baris ke-6. Kamu melangkah satu baris terlalu jauh.','1.300 adalah banyak kertas di baris ke-7 (400 + 6 × 150). Informasi sampai baris ketujuh hanya pengecoh; yang ditanya baris ke-5.'],w:["700 adalah banyaknya di baris ke-3 (400 + 2 × 150).","850 adalah banyaknya di baris ke-4 (400 + 3 × 150).","Benar. Baris ke-5: 400 + 4 × 150 = 1.000.","1.150 adalah banyaknya di baris ke-6 (400 + 5 × 150).","1.300 adalah banyaknya di baris ke-7 (400 + 6 × 150)."],
s:`Ini barisan aritmetika dengan suku pertama a = 400 dan beda b = 550 − 400 = 150.<br>U<sub>n</sub> = a + (n − 1)b<br>U<sub>5</sub> = 400 + 4 × 150 = 1.000.<br>(Informasi sampai baris ketujuh tidak diperlukan untuk baris ke-5.)`},
{t:"m",body:`Seorang pasien dengan kadar asam urat tinggi menjalani terapi menggunakan obat penurun kadar asam urat. Pada hari pertama, kadar asam urat dalam darah tercatat 13 mg/dL. Obat bekerja menurunkan kadar asam urat sebesar 20% setiap hari secara konsisten. Beberapa hal yang perlu diperhatikan:<br>- Pasien mulai merasa lebih nyaman saat kadar asam urat ada di bawah 7 mg/dL.<br>- Pasien dianggap sembuh secara klinis jika kadar asam urat telah mencapai kurang dari 5 mg/dL.`,q:"Pada hari keberapa berapa pasien merasa nyaman namun belum dianggap sembuh secara klinis? Klik pada setiap jawaban benar! Jawaban benar lebih dari satu.",
o:["Hari ke-2","Hari ke-3","Hari ke-4","Hari ke-5","Hari ke-6"],a:[2,3],
w2:['Tidak dipilih. Kadar hari ke-2 = 13 × 0,8 = 10,4 mg/dL. Masih di atas 7, jadi pasien belum merasa nyaman.','Tidak dipilih. Kadar hari ke-3 = 10,4 × 0,8 = 8,32 mg/dL. Masih di atas 7, jadi belum nyaman.','Dipilih. Kadar hari ke-4 = 8,32 × 0,8 = 6,656 mg/dL. Sudah di bawah 7 (nyaman) dan masih di atas 5 (belum sembuh secara klinis).','Dipilih. Kadar hari ke-5 = 6,656 × 0,8 = 5,3248 mg/dL. Masih di bawah 7 (nyaman) dan masih di atas 5 (belum sembuh secara klinis).','Tidak dipilih. Kadar hari ke-6 = 5,3248 × 0,8 ≈ 4,26 mg/dL. Sudah di bawah 5 sehingga dianggap sembuh. Soal meminta nyaman tetapi belum sembuh.'],w:["Kadar 10,4 mg/dL. Belum di bawah 7, jadi belum nyaman.","Kadar 8,32 mg/dL. Masih di atas 7, belum nyaman.","Benar. Kadar 6,656 mg/dL: sudah di bawah 7 (nyaman) dan masih di atas 5 (belum sembuh).","Benar. Kadar 5,325 mg/dL: di bawah 7 dan masih di atas 5.","Kadar 4,26 mg/dL. Sudah di bawah 5, jadi dianggap sembuh secara klinis."],
s:`Setiap hari kadar menjadi 80% dari hari sebelumnya, jadi kadar hari ke-n = 13 × 0,8<sup>n−1</sup>.<br>Hari 1: 13 | Hari 2: 10,4 | Hari 3: 8,32 | Hari 4: 6,656 | Hari 5: 5,325 | Hari 6: 4,26.<br>Syarat: kadar &lt; 7 dan kadar ≥ 5, terpenuhi pada hari ke-4 dan ke-5.`},
{t:"s",body:"Perhatikan gambar berikut.",svg:fig(),q:"Daerah yang diarsir pada gambar tersebut merupakan himpunan penyelesaian dari sistem pertidaksamaan ....",
o:[sys("x − 2y ≥ −4","x + y ≤ 2","x ≥ 0","y ≥ 0"),sys("x − 2y ≥ −4","x + y ≤ 2","y ≥ 0"),sys("x − 2y ≥ −4","x + y ≥ 2","y ≥ 0"),sys("2x − y ≤ 4","x + y ≤ 2","y ≥ 0"),sys("2x − y ≥ 4","x + y ≤ 2","x ≥ 0","y ≥ 0")],a:1,
w2:['Syarat x ≥ 0 artinya hanya daerah di sebelah kanan sumbu y. Padahal arsiran meluas ke kiri sampai titik A(−4, 0). Jadi syarat x ≥ 0 tidak ada pada soal.','Benar. Garis f lewat A(−4, 0) dan B(0, 2): x − 2y = −4. Titik (0, 0) menghasilkan 0 ≥ −4 (benar), sehingga tandanya ≥. Garis g lewat B(0, 2) dan C(2, 0): x + y = 2. Titik (0, 0) menghasilkan 0 ≤ 2, sehingga tandanya ≤. Batas bawah adalah sumbu x: y ≥ 0.','Garis g sudah benar (x + y = 2) tetapi tandanya salah. x + y ≥ 2 memilih daerah di atas garis g, padahal arsiran ada di bawahnya. Uji titik (0, 0): 0 ≥ 2 salah, padahal (0, 0) ada di dalam arsiran.','Garis 2x − y = 4 melewati (2, 0) dan (0, −4), jadi itu bukan garis f. Garis f melewati A(−4, 0) dan B(0, 2) sehingga persamaannya x − 2y = −4.','Ada dua kesalahan: garis 2x − y = 4 bukan garis f, dan syarat x ≥ 0 memotong bagian kiri arsiran.'],w:["Syarat x ≥ 0 membuang bagian segitiga di sebelah kiri sumbu y (sampai titik A(−4, 0)). Daerah arsiran tidak dibatasi sumbu y.","Benar. Garis f, garis g, dan sumbu x semuanya sesuai batas daerah arsiran.","Tanda x + y ≥ 2 memilih daerah di atas garis g. Daerah arsiran ada di bawahnya: titik (0, 0) memenuhi x + y ≤ 2.","Garis 2x − y = 4 melalui (2, 0) dan (0, −4), bukan garis f. Garis f melalui A(−4, 0) dan B(0, 2).","Garis 2x − y = 4 bukan garis f, dan syarat x ≥ 0 juga memotong bagian kiri daerah arsiran."],
s:`Garis f melalui A(−4, 0) dan B(0, 2): y = ½x + 2 → x − 2y = −4. Uji titik (0, 0): 0 ≥ −4 benar, jadi x − 2y ≥ −4.<br>Garis g melalui B(0, 2) dan C(2, 0): x + y = 2. Uji (0, 0): 0 ≤ 2, jadi x + y ≤ 2.<br>Batas bawah daerah adalah sumbu x, jadi y ≥ 0.`},
{t:"s",body:`Bu Silma adalah seorang perangkai bunga. Di tokonya, ia memiliki bunga mawar, lili, dan anyelir. Harga buket ditentukan dari total harga bunga yang digunakan dalam buket tersebut. Ada tiga jenis buket dengan komposisi ketiga bunga beserta harga per buketnya pada gambar berikut.`,svg:fig9(),q:"Bila seorang pembeli ingin membeli buket bunga tipe C namun ingin menambah 2 tangkai lili dan 1 tangkai anyelir dengan harga satuan, maka total harga yang harus dibayar pembeli tersebut adalah ....",
o:["Rp75.000,00","Rp102.000,00","Rp110.000,00","Rp115.000,00","Rp116.000,00"],a:3,
w2:['Itu harga buket tipe C saja. Pembeli juga menambah 2 tangkai lili dan 1 tangkai anyelir, jadi harga harus ditambah.','Berarti tambahan hanya Rp27.000. Padahal lili Rp13.000 dan anyelir Rp14.000, jadi 2 lili + 1 anyelir = 26.000 + 14.000 = Rp40.000.','Berarti tambahan Rp35.000, kurang Rp5.000 dari seharusnya Rp40.000.','Benar. Misal harga mawar m, lili l, anyelir a (dalam ribuan). Dari gambar: 2m + 3l + a = 85; m + 2l + 2a = 70; 3m + l + a = 75. Selesaikan: m = 16, l = 13, a = 14. Total = 75.000 + 2 × 13.000 + 14.000 = Rp115.000.','Berarti tambahan Rp41.000, lebih Rp1.000 dari seharusnya Rp40.000. Biasanya terjadi karena harga lili atau anyelir salah hitung.'],w:["Ini hanya harga buket C, belum ditambah 2 lili dan 1 anyelir.","Tambahan yang dihitung Rp27.000, padahal 2 lili + 1 anyelir = Rp40.000.","Tambahan yang dihitung Rp35.000, padahal seharusnya Rp40.000.","Benar. 75.000 + 2 × 13.000 + 14.000 = 115.000.","Tambahan yang dihitung Rp41.000, padahal seharusnya Rp40.000."],
s:`Misalkan harga mawar = m, lili = l, anyelir = a (dalam ribuan rupiah). Dari gambar (jumlah bunga per buket):<br>Tipe A: 2m + 3l + a = 85<br>Tipe B: m + 2l + 2a = 70<br>Tipe C: 3m + l + a = 75<br>Dari C: a = 75 − 3m − l. Masukkan ke A: −m + 2l = 10, jadi m = 2l − 10. Masukkan ke B: −5m = −80, jadi m = 16, l = 13, a = 14.<br>Total = 75.000 + 2(13.000) + 14.000 = Rp115.000.`},
{t:"m",body:"Perhatikan gambar berikut!",svg:fig10(),q:"Berdasarkan gambar tersebut, pasangan sudut manakah yang membentuk sudut 180°? Klik pada setiap jawaban benar! Jawaban benar lebih dari satu.",
o:["∠A dan ∠B","∠A dan ∠E","∠B dan ∠C","∠B dan ∠D","∠E dan ∠C"],a:[2,3,4],
w2:['Tidak dipilih. ∠A ada di puncak segitiga, sedangkan ∠B ada di garis tengah. Keduanya tidak berada pada satu garis lurus dan tidak berpasangan lewat garis sejajar, jadi jumlahnya tidak 180°.','Tidak dipilih. ∠A dan ∠E tidak punya hubungan sudut khusus, jadi tidak ada alasan jumlahnya 180°.','Dipilih. Garis tengah sejajar alas, dan sisi miring memotong keduanya. ∠B dan ∠C sama-sama berada di antara dua garis sejajar dan di sisi yang sama dari sisi miring (sudut sepihak dalam). Jumlahnya 180°.','Dipilih. ∠B dan ∠D bersebelahan pada satu garis lurus (garis tengah), jadi keduanya berpelurus: B + D = 180°.','Dipilih. ∠C sehadap dengan ∠F, jadi besarnya sama. ∠E bersebelahan dengan ∠F pada garis lurus, jadi E + F = 180°. Karena C = F, maka E + C = 180°.'],w:["∠A (sudut puncak segitiga) dan ∠B tidak membentuk pasangan sudut khusus yang berjumlah 180°.","∠A dan ∠E tidak berpasangan lewat garis sejajar, jadi jumlahnya tidak 180°.","Benar. Keduanya sudut sepihak dalam di antara dua garis sejajar, jumlahnya 180°.","Benar. ∠B dan ∠D berpelurus (berimpit pada satu garis lurus), jumlahnya 180°.","Benar. ∠C sehadap dengan ∠F (sama besar), dan ∠E berpelurus dengan ∠F, jadi ∠E + ∠C = 180°."],
s:`Garis tengah sejajar alas, dan sisi miring menjadi garis transversal.<br>∠B + ∠C = 180° (sepihak dalam).<br>∠B + ∠D = 180° (berpelurus).<br>∠C = ∠F (sehadap) dan ∠E + ∠F = 180° (berpelurus), jadi ∠E + ∠C = 180°.`},
{t:"m",body:"Zara ingin menata kembali kamarnya dengan menambahkan papan jadwal di dinding. Papan jadwal tidak diletakkan pada dinding yang sejajar dengan rak buku gantung. Posisi rak buku gantung dapat dilihat pada gambar berikut.",svg:fig11(),q:"Berdasarkan posisi yang diinginkan, pada dinding manakah papan jadwal akan diletakkan? Klik pada setiap jawaban benar! Jawaban benar lebih dari satu.",
o:["CDHG","BCGF","ABFE","BCFA","ADHE"],a:[1,4],
w:["Salah. CDHG adalah dinding tempat rak buku itu sendiri. Papan jadwal dipasang di dinding lain yang berpotongan tegak lurus dengannya.","Boleh. Dinding BCGF tegak lurus dengan CDHG, jadi tidak sejajar.","Dilarang. ABFE berhadapan dengan CDHG sehingga sejajar dengan dinding rak buku.","Bukan dinding. Titik B, C, F, A tidak sebidang, jadi tidak membentuk dinding ruangan.","Boleh. Dinding ADHE tegak lurus dengan CDHG, jadi tidak sejajar."],
s:`Rak buku gantung berada pada dinding CDHG. Dinding yang sejajar dengannya adalah dinding yang berhadapan, yaitu ABFE.<br>Dinding ruangan hanya ABFE, BCGF, CDHG, dan ADHE (BCFA bukan dinding). Papan jadwal dipasang di dinding lain (bukan dinding rak itu sendiri) yang tidak sejajar dengannya, yaitu BCGF dan ADHE.`},
{t:"s",body:"Perhatikan gambar berikut!",svg:fig12(),q:"Diketahui trapesium KLMN dan NMPO sebangun. Berdasarkan informasi tersebut, berapakah panjang sisi LM?",
o:["6√5 cm","8√5 cm","9√5 cm","10√5 cm","14√5 cm"],a:1,
w:["Kuadratnya 180, padahal LM² = 320.","Benar. LM = √(8² + 16²) = √320 = 8√5 cm.","Kuadratnya 405, padahal LM² = 320.","Kuadratnya 500, padahal LM² = 320.","Kuadratnya 980, padahal LM² = 320."],
s:`Sisi bersesuaian pada dua trapesium sebangun berbanding sama: KL / NM = NM / OP.<br>NM² = 32 × 18 = 576, jadi NM = 24 cm.<br>Selisih alas = 32 − 24 = 8 cm, dan tinggi trapesium KLMN = KN = 16 cm.<br>LM = √(8² + 16²) = √320 = 8√5 cm.`},
{t:"t",body:`Tim adiwiyata SMA Gemilang sedang menata sayuran di kebun sekolah. Mereka menanam tanaman obat keluarga (toga) seperti jahe, kunyit, dan lengkuas. Setiap tanaman ditempatkan di pot yang berbeda ukurannya. Pot tersebut diletakkan di salah satu sisi kebun seperti pada ilustrasi berikut. Ukuran diameter pot: jahe 15 cm, kunyit 26 cm, dan lengkuas 30 cm.`,svg:fig13(),q:"Berdasarkan ilustrasi, tentukan benar atau salah pernyataan berkaitan dengan ukuran sisi kebun yang ditanami tanaman toga tersebut.",
o:["Ada 25 tanaman jahe yang bisa ditanam.","Ada 15 tanaman kunyit yang bisa ditanam.","Ada 10 tanaman lengkuas yang bisa ditanam."],a:[false,true,false],
w:["Salah. 390 : 15 = 26, jadi jahe yang bisa ditanam 26 tanaman, bukan 25.","Benar. 390 : 26 = 15 tanaman kunyit.","Salah. 390 : 30 = 13, jadi lengkuas yang bisa ditanam 13 tanaman, bukan 10."],
s:`Pot diletakkan di sisi miring atas kebun. Sisi itu adalah sisi miring segitiga siku-siku dengan alas 360 cm dan tinggi 500 − 350 = 150 cm.<br>Panjang sisi = √(360² + 150²) = √152.100 = 390 cm.<br>Jahe: 390 / 15 = 26. Kunyit: 390 / 26 = 15. Lengkuas: 390 / 30 = 13.`},
{t:"s",body:"Perhatikan gambar berikut."+grid(-4,1,"B′",260),q:"Titik B direfleksikan oleh garis y = 1, kemudian dirotasi dengan pusat di O(0, 0) sebesar 180° searah jarum jam. Titik B′ pada gambar merupakan bayangan titik B hasil komposisi kedua transformasi tersebut. Gambar titik B yang sesuai adalah ....",
o:[[4,-1],[4,3],[-6,-1],[-2,-1],[2,4]].map(p=>grid(p[0],p[1],"B",150)),a:1,
w:["Titik (4, −1) adalah posisi setelah refleksi (sebelum rotasi), bukan titik awal B.","Benar. B(4, 3) → refleksi y = 1 → (4, −1) → rotasi 180° → (−4, 1) = B′.","B(−6, −1) → refleksi → (−6, 3) → rotasi → (6, −3). Bukan B′.","B(−2, −1) → refleksi → (−2, 3) → rotasi → (2, −3). Bukan B′.","B(2, 4) → refleksi → (2, −2) → rotasi → (−2, 2). Bukan B′."],
s:`Kerjakan dari belakang. Rotasi 180° mengubah (x, y) menjadi (−x, −y), jadi sebelum rotasi titiknya (4, −1).<br>Refleksi terhadap y = 1 mengubah (x, y) menjadi (x, 2 − y). Maka B = (4, 2 − (−1)) = (4, 3).`},
{t:'s',body:`SD Jaya Makmur baru saja mendapat ruangan kelas baru. Murid-murid ingin menghias kelasnya dengan memasang tali hiasan pada bagian langit-langit kelas. Tali hiasan dipasang dari pojok dinding pintu masuk ke bagian tengah langit-langit dinding papan tulis (gambar di bawah adalah tampak atas langit-langit; kelas berukuran 4 m × 6 m dengan tinggi 5 m).<br>Mereka akan membuat tali kedua yang sama seperti tali hiasan pertama untuk dipasang ke pojok yang lain pada dinding pintu.`,svg:fig15(),q:'Apabila mereka membeli gulungan tali yang panjangnya 20 meter, berapakah sisa tali yang tidak terpakai?',
o:['6 m.','10 m.','11 m.','13 m.','15 m.'],a:1,
w:['Sisa 6 m berarti terpakai 14 m (2 × 7). Padahal satu tali bukan 7 m: 3 + 4 salah, harus dicari dengan Pythagoras.','Benar. Dua tali masing-masing 5 m, terpakai 10 m, sisa 20 − 10 = 10 m.','Sisa 11 m berarti terpakai 9 m, tidak sesuai dengan dua tali sepanjang 5 m.','Sisa 13 m berarti hanya satu tali yang dihitung dengan panjang 7 m (3 + 4). Panjang yang benar 5 m dan ada dua tali.','Sisa 15 m berarti hanya satu tali (5 m) yang dihitung. Tali kedua juga dipakai.'],
s:`Tali berada di langit-langit berukuran 4 m × 6 m. Titik tengah sisi dinding papan tulis berjarak 3 m sepanjang dinding dan 4 m menyeberang ruangan dari pojok dinding pintu.<br>Panjang tali = √(3² + 4²) = 5 m (tinggi 5 m tidak dipakai).<br>Tali kedua dari pojok lain dinding pintu juga 3 m dan 4 m, jadi 5 m.<br>Terpakai 5 + 5 = 10 m, sisa 20 − 10 = 10 m.`},
{t:'s',body:`Arif, seorang desain interior akan membuat suatu desain ornamen jam dinding baru. Ornamen tersebut memiliki bentuk dasar gabungan segitiga dan lingkaran. Adapun bentuk ornamen jam dan ukuran yang akan dibuat diberikan pada gambar berikut.`,svg:fig16(),q:'Di sekeliling ornamen jam tersebut akan ditempel kayu tipis untuk menambah efek tiga dimensi. Apabila Arif akan membuat dua buah ornamen jam dinding untuk dijadikan model contoh, berapa panjang kayu tipis yang ia perlukan?',
o:['322,8 cm.','352,8 cm.','362,8 cm.','382,8 cm.','445,6 cm.'],a:3,
w:['Ini 2 × 161,4: sisa alas segitiga di kiri dan kanan lingkaran (2 × 15 cm) tidak dihitung.','Ini 2 × 176,4: hanya satu sisa alas (15 cm) yang dihitung, padahal ada dua (kiri dan kanan).','Ini 2 × 181,4: sisa alas dihitung 20 cm, padahal 50 − 20 = 30 cm.','Benar. Satu ornamen: 65 + 65 + 30 + 31,4 = 191,4 cm. Dua ornamen = 382,8 cm.','Ini 2 × 222,8: memakai keliling lingkaran penuh (62,8 cm), padahal yang terlihat di luar hanya setengah lingkaran.'],
s:`Tinggi total 70 cm = tinggi segitiga + jari-jari lingkaran (10 cm), jadi tinggi segitiga = 60 cm. Pusat lingkaran berada di alas segitiga, setengah lingkaran menggantung di bawahnya.<br>Sisi miring = √(25² + 60²) = √4225 = 65 cm, ada dua: 130 cm.<br>Sisa alas = 50 − 20 = 30 cm (15 cm di kiri dan 15 cm di kanan).<br>Busur setengah lingkaran = ½ × 3,14 × 20 = 31,4 cm.<br>Satu ornamen: 130 + 30 + 31,4 = 191,4 cm. Dua ornamen: 382,8 cm (dengan π = 3,14).`},
{t:'s',body:`Perhatikan permasalahan dalam kotak berikut!<br>Panjang salah satu diagonal suatu layang-layang adalah 20 cm.`,svg:fig17(),q:'Berapakah keliling layang-layang tersebut? Putuskan apakah pernyataan (1) dan pernyataan (2) berikut cukup untuk menjawab permasalahan tersebut!<br>(1) Luas layang-layang adalah 160 cm².<br>(2) Panjang salah satu sisi layang-layang adalah 10 cm.',
o:['Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.','Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.','DUA pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.','Pernyataan (1) SAJA cukup untuk menjawab pertanyaan dan pernyataan (2) SAJA cukup.','Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan.'],a:2,
w:['Luas 160 cm² hanya memberi panjang diagonal yang lain. Letak perpotongan diagonal belum diketahui, jadi panjang sisi belum pasti. (1) saja tidak cukup.','Dengan satu diagonal 20 cm dan satu sisi 10 cm, diagonal lain dan sisi lainnya masih bisa bermacam-macam. (2) saja tidak cukup.','Benar. Gabungan (1) dan (2) menghasilkan tepat satu bentuk layang-layang sehingga kelilingnya tertentu, sementara masing-masing tidak cukup.','Salah. Kedua pernyataan masing-masing tidak cukup (lihat penjelasan pilihan A dan B).','Salah. Kedua pernyataan bersama-sama cukup untuk menentukan keliling.'],
s:`Diagonal yang membagi dua sama panjang kita sebut d, diagonal sumbu simetri kita sebut L.<br>Jika yang 20 cm adalah d (setengahnya 10 cm): luas 160 memberi L = 16, tetapi sisi layang-layang pasti lebih dari 10 cm (miring terhadap sisi tegak 10 cm), sehingga sisi 10 cm mustahil.<br>Jadi 20 cm adalah L. Luas = ½ × d × 20 = 160, maka d = 16 (setengahnya 8). Sisi 10 cm: √(p² + 8²) = 10 → p = 6, sisanya q = 14, sisi lainnya √(14² + 8²) = √260 = 2√65.<br>Keliling = 2(10 + 2√65) = 20 + 4√65 cm. Hasil tunggal hanya jika (1) dan (2) digabung.`},
{t:'s',body:`Pak Omar adalah seorang distributor helm. Hari ini, ia mendapat pesanan untuk mengirimkan helm yang sama dalam jumlah besar menggunakan truk. Agar kualitas terjaga, helm dikemas dalam wadah kardus helm. Adapun ukuran kardus helm dan bak truk diberikan pada gambar berikut.`,svg:fig18(),q:'Pak Omar memberikan arahan pada kurir untuk mengatur posisi atas kardus helm tidak boleh dibalik (tempat masuk kepala harus menghadap ke bawah). Semua kardus helm disusun menghadap depan (seperti pada gambar) atau menghadap samping (apabila gambar diputar 90°). Namun, apabila masih terdapat ruang kosong yang mungkin, maka penyusunan kardus helm dengan posisi berbeda untuk mengisi ruang kosong tersebut dapat dilakukan.<br><br>Berdasarkan posisi susunan tersebut, berapa paling banyak kardus helm yang dapat dimuat di truk tersebut?',
o:['336 kardus.','360 kardus.','384 kardus.','432 kardus.','504 kardus.'],a:1,
w:['Terlalu sedikit. Dengan susunan 5 × 12 per lapis masih bisa dimuat 60 kardus per lapis, bukan 56.','Benar. 6 lapis × 60 kardus per lapis = 360 kardus.','Tidak mungkin. Volume bak 4.320.000 cm³ dibagi volume kardus 12.000 cm³ = 360, jadi tidak bisa lebih dari 360.','Tidak mungkin. Melebihi batas volume 360 kardus.','Tidak mungkin. Melebihi batas volume 360 kardus.'],
s:`Posisi atas tidak boleh dibalik, jadi tinggi kardus tetap 20 cm. Tinggi bak 120 cm → 120 : 20 = 6 lapis.<br>Alas kardus 20 × 30 cm boleh diputar. Alas bak 150 × 240 cm: sisi 30 cm sepanjang lebar 150 cm (150 : 30 = 5) dan sisi 20 cm sepanjang panjang 240 cm (240 : 20 = 12), jadi 5 × 12 = 60 kardus per lapis tanpa ruang sisa.<br>Total 60 × 6 = 360 kardus. Cek batas atas: volume bak 120 × 150 × 240 = 4.320.000 cm³, volume kardus 20 × 20 × 30 = 12.000 cm³, 4.320.000 : 12.000 = 360.`},
{t:'s',body:`Bu Sita, seorang desainer interior, sedang mengerjakan proyek pribadi untuk mempercantik kamar tidurnya. Ia berencana membuat beberapa hiasan lampu tidur dari bahan akrilik. Setiap hiasan akan berbentuk tabung berongga (tanpa alas dan tutup) dengan diameter 14 cm dan tinggi 25 cm. Bagian luar hiasan tabung ini akan dilapisi dengan stiker vinil motif bunga seperti pada gambar berikut.`,svg:fig19(),q:'Stiker vinil dijual dalam lembaran, dan harga satu lembarnya adalah Rp9.000,00. Setiap lembar stiker vinil mampu menutupi area seluas 300 cm². Jika Bu Sita berencana membuat 8 buah hiasan lampu tidur, berapakah biaya minimal yang harus dikeluarkan Bu Sita untuk membeli stiker vinil tersebut?',
o:['Rp72.000,00.','Rp108.000,00.','Rp252.000,00.','Rp270.000,00.','Rp288.000,00.'],a:3,
w:['Rp72.000 hanya 8 lembar (2.400 cm²), jauh kurang dari 8.800 cm² yang harus ditutup.','Rp108.000 hanya 12 lembar (3.600 cm²), masih kurang dari 8.800 cm².','Rp252.000 hanya 28 lembar (8.400 cm²), masih kurang dari 8.800 cm².','Benar. 8.800 : 300 = 29,3, dibulatkan ke atas menjadi 30 lembar. 30 × 9.000 = 270.000.','Rp288.000 adalah 32 lembar, yaitu 4 lembar per hiasan. Itu tidak minimal, karena sisa stiker bisa dipakai untuk hiasan berikutnya.'],
s:`Tabung tanpa alas dan tutup, jadi yang dilapisi hanya selimut tabung.<br>Luas selimut = π × d × t = 22/7 × 14 × 25 = 1.100 cm².<br>8 hiasan: 8 × 1.100 = 8.800 cm².<br>Lembar stiker: 8.800 : 300 ≈ 29,3, dibulatkan ke atas menjadi 30 lembar.<br>Biaya minimal = 30 × Rp9.000 = Rp270.000.`},
{t:'t',body:`Perhatikan gambar berikut.`,svg:fig20(),q:`Jika diketahui nilai cos(α) = ${fr(3,5)}, tentukan Benar atau Salah terkait perbandingan trigonometri berikut!`,
o:[`sin(β) = ${fr('√7',4)}`,`cos(β) = ${fr('√7',5)}`,`tan(β) = ${fr('3√7',7)}`],a:[false,false,true],
w:['Salah. sin(β) = AD / AB = 3/4.','Salah. cos(β) = BD / AB = √7/4, bukan √7/5.','Benar. tan(β) = AD / BD = 3/√7 = 3√7/7.'],
s:`Tanda pada gambar menunjukkan AB = DC = 4 cm.<br>Pada segitiga siku-siku ADC: cos(α) = AD / AC = 3/5, jadi AD : AC : DC = 3 : 5 : 4. Karena DC = 4, maka AD = 3 dan AC = 5.<br>Pada segitiga siku-siku ABD: BD = √(AB² − AD²) = √(16 − 9) = √7.<br>sin(β) = 3/4, cos(β) = √7/4, tan(β) = 3/√7 = 3√7/7.`},
{t:'m',body:`Banyak siswa yang lulus di sekolah Yayasan Cahaya beragam setiap tahunnya. Berikut adalah data banyak lulusan di tiga sekolah menengah swasta milik Yayasan Cahaya (nilai pada grafik adalah perkiraan dari gambar).`,svg:fig21(),q:'Berdasarkan grafik tersebut, berikut ini pernyataan mana saja yang tepat mendeskripsikan banyak lulusan di ketiga sekolah milik Yayasan Cahaya? Pilih setiap jawaban benar! Jawaban benar lebih dari satu.',
o:['Banyak siswa SMA 1 Bintang yang lulus selalu bertambah mulai tahun 2020.','Pada tahun 2017-2020, banyak lulusan dari ketiga sekolah di yayasan Cahaya selalu bertambah.','Banyak lulusan SMK Kejora konsisten naik selama lima tahun terakhir.','Banyak lulusan SMA 2 Bintang tetap sama selama tiga tahun terakhir.','Banyak lulusan ketiga sekolah di tahun 2023 menurun dibanding tahun sebelumnya.'],a:[0,3],
w:['Benar. Garis hijau terus naik dari 2020 sampai 2025 (sekitar 301, 308, 310, 315, 350, 360).','Salah. SMA 1 Bintang tidak selalu naik: sekitar 301, 310, 310, 301 (sempat tetap lalu turun).','Salah. Lima tahun terakhir (2021-2025) SMK Kejora sempat turun di 2023 (sekitar 325 ke 320).','Benar. Garis merah datar di sekitar 300 pada 2023, 2024, dan 2025.','Salah. Pada 2023 hanya SMA 2 Bintang dan SMK Kejora yang turun, SMA 1 Bintang naik.'],
s:`Periksa tiap pernyataan pada garisnya masing-masing: SMA 1 Bintang (hijau) naik terus sejak 2020, SMA 2 Bintang (merah) datar 2023-2025, sedangkan pernyataan lain memuat tahun yang garisnya turun atau tidak seragam. Pernyataan yang tepat: pertama dan keempat.`},
{t:'s',body:`Di sebuah acara bazar yang diadakan oleh suatu sekolah, terdapat 5 stan yang masing-masing dikelola oleh pedagang yang berbeda.`,svg:fig22(),q:'Dalam bazar tersebut, stan pedagang C ingin berada di antara pedagang A dan pedagang D. Banyak kemungkinan susunan atau penataan stan sesuai keinginan pedagang C tersebut adalah ....',
o:['6 susunan','12 susunan','120 susunan','240 susunan','720 susunan'],a:1,
w:['Ini hanya 3!. Susunan A-C-D juga bisa dibalik menjadi D-C-A, jadi harus dikali 2.','Benar. Blok A-C-D atau D-C-A (2 cara) bersama pedagang B dan E: 3! × 2 = 12.','Ini 5!, yaitu semua susunan tanpa syarat C di antara A dan D.','Ini 2 × 5!. Padahal A, C, D menyatu sebagai satu blok sehingga hanya ada 3 objek yang disusun.','Ini 6!, seolah ada 6 objek. Padahal hanya ada 3 objek (blok, B, dan E).'],
s:`Anggap A-C-D sebagai satu blok. Blok ini bisa berbentuk A-C-D atau D-C-A (2 cara).<br>Blok bersama pedagang B dan E menjadi 3 objek, susunannya 3! = 6.<br>Banyak susunan = 3! × 2 = 12.`},
{t:'t',body:`Perhatikan tabel distribusi data jumlah pengunjung perpustakaan Desa Sukamaju pada minggu ke-1 bulan Januari!<table><tr><th>Minggu ke-1</th><th>Senin</th><th>Selasa</th><th>Rabu</th><th>Kamis</th><th>Jumat</th></tr><tr><th>Jumlah Pengunjung</th><td>4</td><td>p</td><td>5</td><td>r</td><td>6</td></tr></table>Pada minggu ke-1 bulan Januari tersebut, diketahui informasi sebagai berikut:<br>1) rata-rata pengunjung perpustakaan setiap hari adalah 6 orang,<br>2) selalu ada minimal dua pengunjung perpustakaan namun tidak pernah melebihi 10 pengunjung pada setiap hari buka (Senin-Jumat), dan<br>3) median dari data pada tabel adalah 6.`,q:'Tentukan Benar atau Salah pada setiap pernyataan berikut terkait jumlah pengunjung perpustakaan pada minggu ke-1 bulan Januari tersebut!',
o:['Banyak pengunjung pada hari Selasa pasti selalu lebih banyak dibandingkan hari lain.','Banyak pengunjung pada hari Kamis pasti lebih dari 5 orang.','Banyak pengunjung pada hari Jumat dan Kamis mungkin saja sama.'],a:[false,true,true],
w:['Salah. Selasa (p) bisa bernilai 6 sampai 9, jadi bisa sama dengan Jumat (6) atau lebih kecil dari Kamis (r), misalnya p = 6 dan r = 9.','Benar. r bernilai 6 sampai 9, jadi pasti lebih dari 5.','Benar. Jika p = 9 maka r = 6, sama dengan Jumat (6). Data 4, 9, 5, 6, 6 memenuhi semua syarat.'],
s:`Rata-rata 6 → total 5 × 6 = 30 → 4 + p + 5 + r + 6 = 30 → p + r = 15.<br>Batas maksimum 10 → p dan r masing-masing antara 5 dan 10.<br>Median = 6. Data terurut: 4, 5, 6, ... Jika salah satu dari p atau r sama dengan 5 (yang lain 10), median menjadi 5. Jadi p dan r harus ≥ 6, yaitu keduanya antara 6 dan 9 dengan p + r = 15.`},
{t:'s',body:`Dalam rangka memperingati Tahun Baru Imlek, sebuah supermarket membuat kotak undian yang berisi hadiah untuk para pelanggannya. Terdapat 60 angpao yang dimasukkan ke dalam kotak tersebut. Hadiahnya terbagi dalam dua kategori, yaitu kupon belanja dan peralatan rumah tangga. Untuk hadiah kupon belanja, terdapat 15 angpao berisi kupon senilai Rp25.000,00 dan 12 angpao berisi kupon senilai Rp50.000,00. Untuk hadiah peralatan rumah tangga, terdapat 10 angpao berisi set sendok-garpu, 8 angpao berisi pemanas air, dan sisanya angpao kosong.<br>Rini menjadi orang pertama yang berkesempatan mengambil satu angpao secara acak dari kotak tersebut.`,q:'Berapakah peluang Rini mengambil angpao yang kosong?',
o:[fr(1,15),fr(1,5),fr(1,4),fr(1,3),fr(5,11)],a:2,
w:['Itu setara 4 angpao kosong dari 60. Padahal angpao kosong ada 15.','Itu setara 12 angpao kosong dari 60. Padahal ada 15.','Benar. Angpao kosong = 60 − (15 + 12 + 10 + 8) = 15, peluang = 15/60 = 1/4.','Itu setara 20 angpao kosong dari 60. Padahal ada 15.','5/11 tidak sesuai dengan 15 angpao kosong dari 60 angpao.'],
s:`Angpao berisi hadiah: 15 + 12 + 10 + 8 = 45.<br>Angpao kosong: 60 − 45 = 15.<br>Peluang kosong = 15/60 = 1/4.`},
{t:'s',body:`Sebuah kantin sekolah mengadakan undian berhadiah.`,svg:fig25(),q:'Hanya kertas yang kosong yang akan selalu dikembalikan lagi ke dalam kotak meskipun terambil berkali-kali. Ani akan mengambil satu buah kertas dari kotak undian. Ani adalah orang kelima yang mengambil kertas undian.<br><br>Kertas apa sajakah yang mungkin sudah terambil oleh orang-orang sebelumnya sehingga peluang Ani memperoleh minuman atau makanan adalah 2/3?',
o:['1 minuman gratis, 1 makanan gratis, dan 2 kertas kosong.','2 makanan gratis dan 2 minuman gratis.','2 minuman gratis dan 2 kertas kosong.','4 kertas kosong.','4 minuman gratis.'],a:3,
w:['Dua kertas gratis tidak kembali: kotak berisi 8 gratis dari 13 kertas, peluang 8/13, bukan 2/3.','Empat kertas gratis tidak kembali: 6 gratis dari 11 kertas, peluang 6/11, bukan 2/3.','Dua kertas gratis tidak kembali: peluang 8/13, bukan 2/3.','Benar. Kertas kosong dikembalikan, sehingga kotak tetap 10 gratis dan 5 kosong. Peluang = 10/15 = 2/3.','Empat minuman gratis tidak kembali: 6 gratis dari 11 kertas, peluang 6/11, bukan 2/3.'],
s:`Awalnya ada 6 + 4 = 10 kertas gratis dan 5 kosong (total 15). Sebelum Ani ada 4 orang.<br>Misalkan g kertas gratis sudah terambil dan tidak kembali. Kertas kosong selalu kembali, jadi tetap 5. Peluang gratis = (10 − g) / (15 − g).<br>(10 − g) / (15 − g) = 2/3 → 30 − 3g = 30 − 2g → g = 0.<br>Jadi keempat orang sebelumnya mengambil kertas kosong.`}
];

11:["Tidak dipilih. CDHG adalah dinding tempat rak buku itu menempel. Papan jadwal dipasang di dinding lain, jadi dinding ini tidak dipakai.","Dipilih. BCGF bertemu CDHG di sisi CG dengan sudut siku-siku, bukan berhadapan. Jadi BCGF tidak sejajar dengan rak dan boleh dipasangi papan jadwal.","Tidak dipilih. ABFE berhadapan langsung dengan CDHG, seperti dua dinding yang saling menghadap. Dinding yang berhadapan itu sejajar, padahal soal melarang dinding yang sejajar dengan rak.","Tidak dipilih. A dan B ada di lantai, sedangkan F ada di langit-langit, jadi keempat titik B, C, F, A tidak berada pada satu bidang datar. BCFA bukan dinding.","Dipilih. ADHE bertemu CDHG di sisi DH dengan sudut siku-siku, jadi tidak sejajar dengan rak. Dinding ini boleh dipakai."],
12:["Cek dengan dikuadratkan: (6√5)² = 36 × 5 = 180. Padahal LM² = 8² + 16² = 64 + 256 = 320. Jadi 6√5 terlalu pendek.","Benar. (1) Karena sebangun, KL : NM = NM : OP, sehingga NM² = 32 × 18 = 576 dan NM = 24 cm. (2) Selisih alas KLMN = 32 − 24 = 8 cm, dan tingginya KN = 16 cm. (3) LM adalah sisi miring segitiga siku-siku bersisi 8 dan 16: LM = √(64 + 256) = √320 = √(64 × 5) = 8√5 cm.","Cek dengan dikuadratkan: (9√5)² = 81 × 5 = 405, padahal LM² = 320. Terlalu panjang.","Cek dengan dikuadratkan: (10√5)² = 100 × 5 = 500, padahal LM² = 320. Terlalu panjang.","Cek dengan dikuadratkan: (14√5)² = 196 × 5 = 980, padahal LM² = 320. Jauh terlalu panjang. Kesalahan umum: memakai alas 32 cm, padahal yang dipakai adalah selisih alas 8 cm."],
13:["Salah. Pot berjajar di sisi miring. Sisi miring itu sisi miring segitiga siku-siku dengan alas 360 cm dan tinggi 500 − 350 = 150 cm, jadi panjangnya √(360² + 150²) = √152.100 = 390 cm. Jahe berdiameter 15 cm, jadi muat 390 : 15 = 26 pot, bukan 25.","Benar. Kunyit berdiameter 26 cm, jadi muat 390 : 26 = 15 pot. Tiap pot memakai satu diameter pada sisi miring 390 cm.","Salah. Lengkuas berdiameter 30 cm, jadi muat 390 : 30 = 13 pot, bukan 10."],
14:["Salah. Uji B(4, −1): refleksi terhadap y = 1 mengubah (x, y) menjadi (x, 2 − y) = (4, 3). Rotasi 180° mengubah (x, y) menjadi (−x, −y) = (−4, −3). Hasilnya (−4, −3), bukan B′(−4, 1). Titik (4, −1) sebenarnya adalah posisi setelah refleksi, bukan titik awal B.","Benar. B(4, 3) → refleksi terhadap y = 1: (4, 2 − 3) = (4, −1) → rotasi 180°: (−4, 1) = B′. Cara cepat: kerjakan mundur dari B′. Putar balik 180° menghasilkan (4, −1), lalu pantulkan balik terhadap y = 1 menghasilkan (4, 3).","Salah. B(−6, −1) → refleksi: (−6, 2 − (−1)) = (−6, 3) → rotasi: (6, −3). Bukan (−4, 1).","Salah. B(−2, −1) → refleksi: (−2, 3) → rotasi: (2, −3). Bukan (−4, 1).","Salah. B(2, 4) → refleksi: (2, 2 − 4) = (2, −2) → rotasi: (−2, 2). Bukan (−4, 1)."],
15:["Sisa 6 m berarti terpakai 14 m, yaitu 2 tali × 7 m. Angka 7 muncul dari 3 + 4, padahal tali ditarik lurus miring, bukan menyusuri dua sisi siku-siku. Panjang tali sebenarnya √(3² + 4²) = 5 m.","Benar. Tali berada di langit-langit, jadi tinggi 5 m tidak dipakai. Dari pojok dinding pintu ke tengah dinding papan tulis: 4 m melintang ruangan dan 3 m ke samping (setengah dari 6 m). Panjang tali = √(3² + 4²) = 5 m. Dua tali = 10 m, sisa 20 − 10 = 10 m.","Sisa 11 m berarti terpakai 9 m. Itu tidak sama dengan dua tali yang masing-masing 5 m (total 10 m).","Sisa 13 m berarti terpakai 7 m, yaitu satu tali dengan panjang salah (3 + 4). Padahal panjang tali 5 m dan ada dua tali.","Sisa 15 m berarti terpakai 5 m, yaitu hanya satu tali. Soal menyebut ada tali kedua yang sama panjang, jadi total terpakai 10 m."],
16:["322,8 = 2 × 161,4, dan 161,4 = 130 + 31,4. Jadi hanya dua sisi miring dan busur yang dihitung. Sisa alas segitiga (30 cm) terlupa.","352,8 = 2 × 176,4, dan 176,4 = 130 + 15 + 31,4. Hanya satu sisa alas (15 cm) yang dihitung, padahal ada dua, kiri dan kanan lingkaran, jadi 30 cm.","362,8 = 2 × 181,4, dan 181,4 = 130 + 20 + 31,4. Sisa alas dihitung 20 cm, padahal 50 − 20 = 30 cm.","Benar. (1) Tinggi total 70 cm = tinggi segitiga + jari-jari 10 cm, jadi tinggi segitiga = 60 cm. (2) Sisi miring = √(25² + 60²) = √4225 = 65 cm, dua buah = 130 cm. (3) Sisa alas = 50 − 20 = 30 cm. (4) Setengah lingkaran = ½ × 3,14 × 20 = 31,4 cm. Satu ornamen = 130 + 30 + 31,4 = 191,4 cm. Dua ornamen = 382,8 cm.","445,6 = 2 × 222,8, dan 222,8 = 130 + 30 + 62,8. Angka 62,8 adalah keliling lingkaran penuh, padahal hanya setengah lingkaran yang menjadi tepi ornamen."],
17:["Luas 160 cm² dan satu diagonal 20 cm hanya memberi panjang diagonal lainnya (16 cm). Letak titik potong kedua diagonal belum diketahui, padahal letak itu menentukan panjang sisi. Keliling jadi berubah-ubah, jadi pernyataan (1) saja tidak cukup.","Satu diagonal 20 cm dan satu sisi 10 cm belum mengunci bentuk. Diagonal lainnya dan sisi-sisi lainnya masih bisa bermacam-macam, jadi pernyataan (2) saja tidak cukup.","Benar. Gabungan (1) dan (2) mengunci bentuk. Jika 20 cm adalah diagonal yang dibagi dua sama panjang (setengahnya 10), semua sisi pasti lebih dari 10 cm, sehingga sisi 10 cm mustahil. Jadi 20 cm adalah diagonal sumbu simetri, dan diagonal lainnya 16 cm (setengahnya 8). Sisi 10: √(p² + 8²) = 10 sehingga p = 6, sisanya 14, dan sisi lain = √(14² + 8²) = 2√65. Keliling = 20 + 4√65 cm, hanya satu nilai.","Keliru. Masing-masing pernyataan sudah terbukti tidak cukup (lihat pilihan A dan B).","Keliru. Memang masing-masing tidak cukup, tetapi jika digabung bentuk layang-layang terkunci sehingga kelilingnya pasti."],
18:["336 = 56 × 6. Terlalu sedikit, karena satu lapis bisa memuat 60 kardus tanpa sisa ruang (5 × 12).","Benar. (1) Kardus tidak boleh dibalik, jadi tingginya tetap 20 cm. Tinggi bak 120 cm memuat 120 : 20 = 6 lapis. (2) Alas kardus 20 × 30 cm boleh diputar. Alas bak 150 × 240 cm: sisi 30 cm searah 150 cm memberi 5 kardus, sisi 20 cm searah 240 cm memberi 12 kardus, jadi 5 × 12 = 60 per lapis, pas tanpa sisa. (3) Total 60 × 6 = 360. Cek volume: 4.320.000 : 12.000 = 360.","Tidak mungkin. 384 × 12.000 = 4.608.000 cm³, lebih besar dari volume bak 4.320.000 cm³.","Tidak mungkin. 432 × 12.000 = 5.184.000 cm³, melebihi volume bak 4.320.000 cm³.","Tidak mungkin. 504 × 12.000 = 6.048.000 cm³, melebihi volume bak 4.320.000 cm³."],
19:["Rp72.000 hanya cukup untuk 8 lembar, yaitu 2.400 cm². Padahal yang harus ditutup 8.800 cm².","Rp108.000 hanya cukup untuk 12 lembar, yaitu 3.600 cm². Masih jauh kurang dari 8.800 cm².","Rp252.000 hanya cukup untuk 28 lembar, yaitu 8.400 cm². Masih kurang 400 cm² dari 8.800 cm².","Benar. (1) Tabung tanpa alas dan tutup, jadi hanya selimut yang dilapisi: π × d × t = 22/7 × 14 × 25 = 1.100 cm². (2) Untuk 8 hiasan: 8 × 1.100 = 8.800 cm². (3) Jumlah lembar = 8.800 : 300 ≈ 29,3, dibulatkan ke atas menjadi 30 karena lembar tidak bisa dibeli sebagian. (4) Biaya = 30 × 9.000 = Rp270.000.","Rp288.000 adalah 32 lembar, yaitu 4 lembar per hiasan. Itu boros, karena potongan sisa stiker bisa dipakai untuk hiasan lain. Cukup 30 lembar."],
20:["Salah. Pada segitiga siku-siku ADC, cos(α) = 3/5 dan DC = 4 (sama dengan AB), jadi sisinya mengikuti 3 : 4 : 5 dan AD = 3. Pada segitiga ABD, sin(β) = depan/miring = AD/AB = 3/4. Nilai √7/4 bukan sin(β), melainkan cos(β).","Salah. cos(β) = samping/miring = BD/AB. BD = √(AB² − AD²) = √(16 − 9) = √7, jadi cos(β) = √7/4. Penyebutnya 4 (AB), bukan 5. Angka 5 adalah panjang AC, sisi segitiga yang lain.","Benar. tan(β) = depan/samping = AD/BD = 3/√7. Rasionalkan dengan mengalikan √7/√7: 3√7/7."],
21:["Dipilih. Mulai 2020, SMA 1 Bintang (hijau) bernilai kira-kira 301, 308, 310, 315, 350, 360, naik terus tiap tahun.","Tidak dipilih. Pada 2017-2020 SMA 1 Bintang bernilai sekitar 301, 310, 310, 301: tetap di 2019 lalu turun di 2020. Satu sekolah yang tidak naik sudah cukup membuat pernyataan ini salah.","Tidak dipilih. Lima tahun terakhir (2021-2025), SMK Kejora bernilai sekitar 320, 325, 320, 350, 400. Pada 2023 turun dari 325 ke 320, jadi tidak konsisten naik.","Dipilih. SMA 2 Bintang (merah) bernilai sekitar 300 pada 2023, 2024, dan 2025, jadi tetap sama selama tiga tahun terakhir.","Tidak dipilih. Dari 2022 ke 2023, SMA 2 Bintang turun (320 ke 300) dan SMK Kejora turun (325 ke 320), tetapi SMA 1 Bintang naik (310 ke 315). Pernyataan baru benar jika ketiganya turun."],
22:["6 = 3! hanya menghitung susunan 3 objek. Blok A-C-D bisa juga dibalik menjadi D-C-A, jadi hasilnya harus dikali 2.","Benar. Anggap A-C-D sebagai satu blok. Blok itu bisa berbentuk A-C-D atau D-C-A (2 cara). Blok, B, dan E menjadi 3 objek yang disusun dengan 3! = 6 cara. Jadi 6 × 2 = 12 susunan.","120 = 5! adalah semua susunan lima stan tanpa syarat. Syarat C di antara A dan D belum dipakai.","240 = 2 × 5! menghitung lima objek terpisah. Padahal A, C, D menyatu sebagai satu blok sehingga yang disusun hanya 3 objek.","720 = 6! seolah ada 6 objek. Padahal hanya ada 3 objek yang disusun (blok, B, dan E)."],
23:["Salah. Total pengunjung = 5 × 6 = 30, jadi p + r = 15. Median 6 membuat p dan r harus antara 6 dan 9. Jadi Selasa (p) bisa 6 (sama dengan Jumat) atau p = 6 dengan r = 9 (lebih kecil dari Kamis). Selasa tidak pasti paling banyak.","Benar. r berada di antara 6 dan 9, jadi pasti lebih dari 5. Mengapa r tidak bisa 5? Jika r = 5 maka p = 10, dan data terurut 4, 5, 5, 6, 10 bermedian 5, bukan 6.","Benar. Contoh: p = 9 dan r = 6. Data 4, 9, 5, 6, 6 berjumlah 30 (rata-rata 6), terurut 4, 5, 6, 6, 9 (median 6), dan tidak ada yang melebihi 10. Kamis dan Jumat sama-sama 6."],
24:["1/15 = 4/60, berarti hanya 4 angpao kosong. Padahal kosong = 60 − (15 + 12 + 10 + 8) = 15.","1/5 = 12/60, berarti 12 angpao kosong. Padahal angpao kosong ada 15.","Benar. Angpao berhadiah = 15 + 12 + 10 + 8 = 45. Angpao kosong = 60 − 45 = 15. Peluang = 15/60 = 1/4.","1/3 = 20/60, berarti 20 angpao kosong. Padahal angpao kosong ada 15.","5/11 tidak mungkin: 60 × 5/11 ≈ 27,3 bukan bilangan bulat, jadi tidak cocok sebagai banyak angpao kosong."],
25:["Salah. 2 kertas gratis terambil dan tidak kembali, kertas kosong selalu kembali. Gratis tersisa 10 − 2 = 8, total 15 − 2 = 13, peluang 8/13 ≈ 0,615, sedangkan 2/3 ≈ 0,667.","Salah. 4 kertas gratis hilang: gratis tersisa 6, total 11, peluang 6/11 ≈ 0,545, bukan 2/3.","Salah. Hanya 2 minuman gratis yang hilang (2 kosong dikembalikan): gratis 8, total 13, peluang 8/13, bukan 2/3.","Benar. Misalkan g kertas gratis sudah hilang. Peluang = (10 − g)/(15 − g) = 2/3, jadi 30 − 3g = 30 − 2g sehingga g = 0. Artinya tidak ada kertas gratis yang hilang, jadi keempat orang sebelumnya mengambil kertas kosong (yang dikembalikan).","Salah. 4 minuman gratis hilang: gratis tersisa 6, total 11, peluang 6/11, bukan 2/3."]

if(q.t=="s"){h+=`<p><b>Pilihanmu (${L[s.sel]}):</b> ${q.w[s.sel]}</p>`+(ok?"":`<p><b>Jawaban benar (${L[q.a]}):</b> ${q.w[q.a]}</p>`)}
else h+=`<ul>${q.o.map((o,k)=>`<li><b>${q.t=="t"?o:o}</b>${q.t=="t"?` (kamu: ${s.sel[k]===null?"kosong":s.sel[k]?"Benar":"Salah"})`:` (${s.sel.includes(k)?"kamu pilih":"tidak dipilih"})`}: ${q.w[k]}</li>`).join("")}</ul>`;
h+=`<div class="sol"><b>Langkah penyelesaian</b><p>${q.s}</p></div></div>`}
h+=`<div class="bar"><button class="btn sec" data-a="prev" ${cur==0?"disabled":""}>Soal sebelumnya</button><button class="btn fl" data-a="flag">${s.fl?"Batalkan ragu-ragu":"Ragu-ragu"}</button>${cur==Q.length-1?`<button class="btn" data-a="fin">Selesai</button>`:`<button class="btn" data-a="next">Soal berikutnya</button>`}</div>
<div class="bar"><button class="btn" data-a="chk" ${ck||!done(cur)?"disabled":""}>Cek jawaban dan penjelasan</button></div>`;
m.innerHTML=h}
function result(){const ok=Q.map((_,i)=>st[i].ck||fin?right(i)&&done(i):false);const n=ok.filter(Boolean).length;
$("main").innerHTML=`<div class="qh">Hasil latihan</div><div class="score">${Math.round(n/Q.length*100)}</div><p>${n} dari ${Q.length} soal benar. ${Q.filter((_,i)=>!done(i)).length} soal belum dijawab.</p><p>Ketuk nomor soal untuk melihat jawabanmu dan penjelasannya.</p><div class="rv">${Q.map((_,i)=>`<button class="${ok[i]?"y":"n"}" data-rv="${i}">${i+1} ${ok[i]?"✓":"✗"}</button>`).join("")}</div><div class="bar"><button class="btn sec" data-a="again">Ulangi dari awal</button></div>`}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset,s=st[cur>=0?cur:0];

if(d.t!==undefined&&!s.ck){s.sel[+d.t]=d.v=="true";R();return}
if(d.a=="prev"){cur--;R()}else if(d.a=="next"){cur++;R()}else if(d.a=="flag"){s.fl=!s.fl;R()}else if(d.a=="chk"){s.ck=true;R()}
else if(d.a=="fin"){finish()}else if(d.a=="again"){location.reload()}});
